server {
    listen 80;
    server_name your_domain_or_ip;      # 部署时替换为你的域名或公网 IP

    root /var/www/blog/dist;             # 前端 dist 上传到此处
    index index.html;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml font/woff2;
    gzip_vary on;

    # ---------- 带指纹的静态资源长缓存 ----------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- API 反向代理到后端 ----------
    # 注意：proxy_pass 结尾不加 "/"，保留 /api 前缀
    # 本项目所有控制器 @RequestMapping 均带 /api（如 /api/articles），后端无 context-path
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;             # 与后端 multipart 10MB 对齐
    }

    # ---------- Vue history 路由回退 ----------
    # 否则直接访问 / 刷新 /admin/dashboard、/article/1 等子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- HTTPS（后续）----------
    # 安装 certbot 后执行：certbot --nginx -d your_domain
    # certbot 会自动在本 server 注入 443 + 证书配置，并把 80 重定向到 443
}
